<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Творчество · Таинственный фотограф</title>
<meta name="description" content="Творчество — записи и фотографии от Таинственного фотографа">
<link rel="canonical" href="https://irina-photo.github.io/tvorchestvo.html">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:url" content="https://irina-photo.github.io/tvorchestvo.html">
<meta property="og:site_name" content="Таинственный фотограф">
<meta property="og:title" content="Творчество · Таинственный фотограф">
<meta property="og:description" content="Записи и фотографии от Таинственного фотографа">
<meta property="og:locale" content="ru_RU">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0800;color:#e8d5a0;font-family:Georgia,serif;min-height:100vh}
body{padding:40px 20px 120px;background-image:
  radial-gradient(1200px 800px at 20% 0%,rgba(200,152,74,0.08),transparent 60%),
  radial-gradient(1000px 700px at 80% 100%,rgba(200,152,74,0.05),transparent 60%),
  linear-gradient(to bottom,#14100a,#0a0800)}

/* Header */
header{max-width:780px;margin:0 auto 50px;text-align:center;position:relative}
h1.title{font-size:28px;letter-spacing:8px;color:#e8c84a;font-weight:normal;text-transform:uppercase;margin-bottom:8px;text-shadow:0 2px 10px rgba(0,0,0,0.8)}
.subtitle{font-size:12px;letter-spacing:4px;opacity:0.5;font-style:italic}
.backlink{position:absolute;top:4px;left:0;font-size:12px;letter-spacing:2px;color:#c8a84a;text-decoration:none;opacity:0.7;transition:opacity 0.2s}
.backlink:hover{opacity:1}
@media (max-width:600px){
  .backlink{position:static;display:block;margin-bottom:16px}
  h1.title{font-size:22px;letter-spacing:5px}
}

/* Posts */
main{max-width:780px;margin:0 auto}
.post{background:linear-gradient(180deg,rgba(35,25,10,0.88),rgba(25,17,6,0.92));border:1px solid rgba(200,152,74,0.22);border-radius:14px;padding:32px 34px;margin-bottom:30px;box-shadow:0 22px 60px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,235,180,0.05)}
.post .date{font-size:11px;letter-spacing:3px;color:#c8a84a;opacity:0.8;text-transform:uppercase;margin-bottom:10px;text-align:center;font-style:italic}
.post h2{font-size:24px;color:#e8d5a0;font-weight:normal;letter-spacing:1px;margin-bottom:18px;text-align:center;line-height:1.3}
.post .text{font-size:16px;line-height:1.75;color:rgba(232,213,160,0.94);white-space:pre-wrap;word-wrap:break-word;text-align:justify;font-family:Georgia,serif}
.post .text a{color:#e8c84a;text-decoration:underline}
.post .images{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:22px}
.post .images img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid rgba(200,152,74,0.3);box-shadow:0 10px 24px rgba(0,0,0,0.45);cursor:zoom-in;transition:transform 0.25s,border-color 0.25s}
.post .images img:hover{transform:translateY(-2px);border-color:#e8c84a}
@media (max-width:600px){
  .post{padding:22px 18px}
  .post h2{font-size:20px}
  .post .text{font-size:15px;text-align:left}
  .post .images{grid-template-columns:repeat(2,1fr);gap:8px}
}

/* Empty state */
.empty{text-align:center;padding:80px 20px;opacity:0.5;font-style:italic;letter-spacing:1px}

/* Loading */
.loading{text-align:center;padding:60px;opacity:0.4;letter-spacing:3px}

/* Lightbox */
#lb{display:none;position:fixed;inset:0;background:rgba(5,3,0,0.92);z-index:999;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,0.7)}
#lb .lbx{position:fixed;top:16px;right:22px;font-size:30px;color:#e8d5a0;cursor:pointer;opacity:0.7;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4)}
#lb .lbx:hover{opacity:1}
</style>
</head>
<body>

<header>
  <a class="backlink" href="/">← к галерее</a>
  <h1 class="title">Творчество</h1>
  <div class="subtitle">Таинственный фотограф</div>
</header>

<main id="posts">
  <div class="loading">Загружаю…</div>
</main>

<div id="lb" onclick="closeLb()">
  <span class="lbx" onclick="event.stopPropagation();closeLb()">✕</span>
  <img id="lbi" src="" alt="">
</div>

<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(d){
  if(!d) return '';
  try{
    var parts = d.split('-');
    if(parts.length !== 3) return d;
    var months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return parseInt(parts[2])+' '+months[parseInt(parts[1])-1]+' '+parts[0];
  }catch(e){ return d; }
}
function openLb(src){
  document.getElementById('lbi').src = src;
  document.getElementById('lb').classList.add('on');
}
function closeLb(){
  document.getElementById('lb').classList.remove('on');
}

async function load(){
  var mount = document.getElementById('posts');
  try{
    var res = await fetch('posts.json?t='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    var data = await res.json();
    var posts = (data.posts||[]).slice();
    posts.sort(function(a,b){
      return (b.date||'').localeCompare(a.date||'') || (b.id||'').localeCompare(a.id||'');
    });
    if(!posts.length){
      mount.innerHTML = '<div class="empty">Пока нет записей. Скоро здесь появятся.</div>';
      return;
    }
    mount.innerHTML = posts.map(function(p){
      var imgs = (p.images||[]).map(function(src){
        var safe = esc(src);
        return '<img src="'+safe+'" loading="lazy" onclick="openLb(\''+safe.replace(/'/g,"\\'")+'\')">';
      }).join('');
      var imgsHtml = imgs ? '<div class="images">'+imgs+'</div>' : '';
      return '<article class="post">'+
        '<div class="date">'+esc(fmtDate(p.date))+'</div>'+
        '<h2>'+esc(p.title||'Без названия')+'</h2>'+
        '<div class="text">'+esc(p.text||'')+'</div>'+
        imgsHtml+
      '</article>';
    }).join('');
  }catch(e){
    mount.innerHTML = '<div class="empty">Не удалось загрузить записи: '+esc(e.message)+'</div>';
  }
}

document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeLb();
});

load();
</script>
</body>
</html>
