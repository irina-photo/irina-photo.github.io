<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Музей Ирины · Анимация света</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0800;overflow:hidden;font-family:Georgia,serif;transition:background 0.5s ease}
#hall{position:absolute;top:0;left:0;display:flex;height:100vh;transition:transform 0.7s cubic-bezier(.4,0,.2,1)}
.wall{width:100vw;height:100vh;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap;padding:50px}
.wall-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity 0.5s ease;filter:brightness(0.5) contrast(1.1)}
.wall-floor{position:absolute;bottom:0;left:0;width:100%;height:28%;background:linear-gradient(to bottom,rgba(0,0,0,0.3),rgba(0,0,0,0.5));transition:background 0.5s ease}
.strip{position:absolute;top:60%;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(200,152,74,0.3),rgba(200,152,74,0.5),rgba(200,152,74,0.3),transparent);z-index:1}
.fw{position:relative;cursor:pointer;transition:all 0.4s;z-index:2;margin:10px}
.fw:hover{transform:scale(1.05) translateY(-2px)}
.fo{padding:15px;background:rgba(245,240,232,0.95);box-shadow:
  0 0 0 2px #b8962a,
  0 0 0 4px #e8c84a,
  0 0 0 6px #8a6a1a,
  0 25px 50px rgba(0,0,0,0.9),
  0 15px 30px rgba(0,0,0,0.7),
  0 8px 16px rgba(0,0,0,0.5),
  -2px -2px 8px rgba(0,0,0,0.3),
  2px 2px 8px rgba(0,0,0,0.3),
  inset 0 0 25px rgba(200,152,74,0.15),
  inset 0 0 15px rgba(255,215,0,0.1);
border-radius:2px;transform:translateZ(10px)}
.fo img{display:block;object-fit:cover;width:180px;height:135px;border-radius:1px;filter:brightness(1.05) contrast(1.02)}
.pl{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);background:rgba(42,31,10,0.85);border:1px solid #6B4F10;padding:3px 12px;white-space:nowrap;font-size:9px;letter-spacing:1px;color:#c8a84a;font-style:italic;border-radius:3px;text-shadow:1px 1px 2px rgba(0,0,0,0.6)}
/* АНИМИРОВАННЫЕ СВЕТИЛЬНИКИ */
.corner-light{position:fixed;z-index:5;transition:all 0.3s ease}
/* САМИ СВЕТИЛЬНИКИ */
.corner-light img{position:relative;object-fit:contain;filter:brightness(1.4) contrast(1.3) drop-shadow(0 4px 12px rgba(0,0,0,0.8));transition:all 0.3s ease;z-index:2}
.corner-light:hover img{transform:scale(1.1);filter:brightness(1.5) contrast(1.4) drop-shadow(0 6px 16px rgba(0,0,0,0.9))}
/* РАСПОЛОЖЕНИЕ */
#light-top-right{top:20px;right:80px}
#light-top-left{top:20px;left:20px}
#light-bottom-left{bottom:20px;left:20px}
#light-bottom-right{bottom:20px;right:80px}
/* РАЗМЕРЫ */
#light-top-right img, #light-top-left img{width:80px;height:120px}
#light-bottom-left img, #light-bottom-right img{width:100px;height:150px}
/* ПРАВЫЙ ВЕРХНИЙ ФОНАРЬ - РАЗВЕРНУТ ВЛЕВО */
#light-top-right img{transform:scaleX(-1)}
#light-top-right:hover img{transform:scaleX(-1) scale(1.1)}
/* АККУРАТНЫЕ СВЕТОВЫЕ ЛУЧИ */
.light-beam{position:fixed;background:radial-gradient(ellipse,rgba(255,255,255,0.2),rgba(255,255,255,0.08),rgba(255,255,255,0),transparent);filter:blur(30px);opacity:0.7;z-index:3;pointer-events:none}
#beam-top-right{top:50px;right:110px;width:320px;height:400px}
#beam-top-left{top:50px;left:50px;width:320px;height:400px}
#beam-bottom-left{bottom:50px;left:50px;width:360px;height:450px}
#beam-bottom-right{bottom:50px;right:110px;width:360px;height:450px}
/* АНИМАЦИЯ СВЕТА НА СТЕНЫ - НОВАЯ! */
.wall-light{position:fixed;z-index:4;pointer-events:none;opacity:0.6}
/* Свет на стены от верхних фонарей */
#wall-light-top-right{top:0;right:0;width:300px;height:400px;background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05),transparent);filter:blur(40px)}
#wall-light-top-left{top:0;left:0;width:300px;height:400px;background:linear-gradient(225deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05),transparent);filter:blur(40px)}
/* Свет на стены от нижних фонарей */
#wall-light-bottom-left{bottom:0;left:0;width:350px;height:450px;background:linear-gradient(315deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04),transparent);filter:blur(45px)}
#wall-light-bottom-right{bottom:0;right:0;width:350px;height:450px;background:linear-gradient(45deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04),transparent);filter:blur(45px)}
/* АНИМАЦИЯ МЕРЦАНИЯ ФОНАРЕЙ */
@keyframes light-glow{
  0%,100%{opacity:0.7}
  50%{opacity:1}
}
.corner-light{animation:light-glow 4s ease-in-out infinite}
/* АНИМАЦИЯ ПУЛЬСАЦИИ СВЕТА НА СТЕНЫ */
@keyframes wall-light-pulse{
  0%,100%{opacity:0.4;transform:scale(1)}
  25%{opacity:0.6;transform:scale(1.05)}
  50%{opacity:0.8;transform:scale(1.1)}
  75%{opacity:0.6;transform:scale(1.05)}
}
.wall-light{animation:wall-light-pulse 6s ease-in-out infinite}
/* Разная скорость анимации для каждого фонаря */
#wall-light-top-right{animation-delay:0s}
#wall-light-top-left{animation-delay:1.5s}
#wall-light-bottom-left{animation-delay:3s}
#wall-light-bottom-right{animation-delay:4.5s}

#lb::before{content:'';position:absolute;inset:0;z-index:0;background-image:url('rooms/lightbox_wall.jpg');background-size:contain;background-position:center bottom;background-repeat:no-repeat;opacity:1;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,1) 18%,rgba(0,0,0,1) 82%,rgba(0,0,0,0) 100%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,1) 18%,rgba(0,0,0,1) 82%,rgba(0,0,0,0) 100%)}

function _lbHamming64(a,b){
  if(typeof a!=='bigint' || typeof b!=='bigint') return 999;
  var x=a^b;
  var c=0;
  while(x){
    x = x & (x-1n);
    c++;
  }
  return c;
}

function _lbDHashFromImage(img){
  var w=9,h=8;
  var cv=document.createElement('canvas');
  cv.width=w;cv.height=h;
  var ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0,w,h);
  var d=ctx.getImageData(0,0,w,h).data;
  var bits=0n;
  for(var y=0;y<h;y++){
    for(var x=0;x<w-1;x++){
      var i=(y*w+x)*4;
      var i2=(y*w+x+1)*4;
      var g1=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
      var g2=(d[i2]*0.299+d[i2+1]*0.587+d[i2+2]*0.114);
      bits = (bits<<1n) | (g1>g2 ? 1n : 0n);
    }
  }
  return bits;
}

function findSimilarGroupsInBrowser(){
  if(_lbSimilarRunning) return;
  _lbSimilarRunning=true;
  var sim=document.getElementById('lbthumbs-similar');
  if(!sim){_lbSimilarRunning=false;return;}
  sim.innerHTML='Ищу похожие… (это может занять 1-2 минуты)';

  var maxPhotos=PH.length;
  var hashes=new Array(maxPhotos);
  var i=0;
  function step(){
    if(i>=maxPhotos){
      buildSimilarGroups(hashes);
      _lbSimilarRunning=false;
      return;
    }
    var n=String(i+1).padStart(3,'0');
    var url='images/picture-'+n+'.jpg';
    var im=new Image();
    im.onload=function(){
      try{hashes[i]=_lbDHashFromImage(im);}catch(e){hashes[i]=null;}
      i++;
      if(i%40===0) sim.innerHTML='Ищу похожие… '+i+' / '+maxPhotos;
      setTimeout(step,0);
    };
    im.onerror=function(){hashes[i]=null;i++;setTimeout(step,0);};
    im.src=url+'?v='+(Date.now());
  }

  function buildSimilarGroups(h){
    var threshold=6;
    var used=new Array(h.length).fill(false);
    var groups=[];
    for(var a=0;a<h.length;a++){
      if(used[a] || h[a]==null) continue;
      var g=[a];
      for(var b=a+1;b<h.length;b++){
        if(used[b] || h[b]==null) continue;
        if(_lbHamming64(h[a],h[b])<=threshold) g.push(b);
      }
      if(g.length>1){
        for(var k=0;k<g.length;k++) used[g[k]]=true;
        groups.push(g);
      }
    }
    renderSimilarGroups(groups);
  }

  function renderSimilarGroups(groups){
    sim.innerHTML='';
    if(!groups.length){
      sim.textContent='Похожих групп не найдено (по текущему порогу).';
      return;
    }
    for(var gi=0;gi<groups.length;gi++){
      var g=groups[gi];
      var wrap=document.createElement('div');
      wrap.className='simgrp';
      var title=document.createElement('div');
      title.className='simgrp-title';
      title.textContent='Группа '+(gi+1)+' · '+g.length+' фото (клик по миниатюре = отметить/снять отметку)';
      wrap.appendChild(title);
      for(var k=0;k<g.length;k++){
        var idx=g[k];
        var num=idx+1;
        var nn=String(num).padStart(3,'0');
        var t=document.createElement('div');
        t.className='simthumb';
        t.setAttribute('data-num', String(num));
        var img=document.createElement('img');
        img.loading='lazy';
        img.src='images/picture-'+nn+'.jpg?v='+Date.now();
        var b=document.createElement('b');
        b.textContent=nn;
        t.appendChild(img);
        t.appendChild(b);
        if(_lbThumbsMarks.has(num)) t.classList.add('marked');
        t.onclick=function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          var n=parseInt(this.getAttribute('data-num'),10);
          if(isFinite(n)){
            toggleLbThumbMarkByNum(n);
            this.classList.toggle('marked', _lbThumbsMarks.has(n));
          }
        };
        wrap.appendChild(t);
      }
      sim.appendChild(wrap);
    }
  }

  step();
}

function buildLbThumbs(){
  if(_lbThumbsBuilt) return;
  var grid=document.getElementById('lbthumbs-grid');
  if(!grid) return;
  loadLbThumbsMarks();
  var frag=document.createDocumentFragment();
  for(var i=0;i<PH.length;i++){
    var item=document.createElement('div');
    item.className='lbthumb';
    item.setAttribute('data-i',i);
    var img=document.createElement('img');
    img.alt='';
    img.loading='lazy';
    img.setAttribute('data-src',PH[i].p);
    img.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
    (function(it,im){
      im.onerror=function(){
        it.classList.add('missing');
      };
    })(item,img);
    var badge=document.createElement('div');
    badge.className='lbthumb-badge';
    badge.textContent=(i+1);
    item.appendChild(img);
    item.appendChild(badge);
    item.onclick=function(ev){
      ev.stopPropagation();
      var idx=parseInt(this.getAttribute('data-i'),10);
      if(!isFinite(idx)) return;
      if(_lbThumbsSelectMode){
        var n=idx+1;
        if(_lbThumbsMarks.has(n)) _lbThumbsMarks.delete(n);
        else _lbThumbsMarks.add(n);
        saveLbThumbsMarks();
        setLbThumbMarked(idx);
        return;
      }
      currentLb=idx;
      updateLb();
      closeLbThumbs();
    };
    frag.appendChild(item);
  }
  grid.appendChild(frag);
  refreshLbThumbsMarks();
  if('IntersectionObserver' in window){
    _lbThumbObserver=new IntersectionObserver(function(entries){
      for(var k=0;k<entries.length;k++){
        var e=entries[k];
        if(!e.isIntersecting) continue;
        var im=e.target;
        var ds=im.getAttribute('data-src');
        if(ds && im.src && im.src.indexOf('data:image/gif')===0) im.src=ds;
        if(_lbThumbObserver) _lbThumbObserver.unobserve(im);
      }
    },{root:grid,rootMargin:'220px 0px'});
    var imgs=grid.querySelectorAll('img[data-src]');
    for(var j=0;j<imgs.length;j++) _lbThumbObserver.observe(imgs[j]);
  }else{
    var imgs2=grid.querySelectorAll('img[data-src]');
    for(var j2=0;j2<imgs2.length;j2++) imgs2[j2].src=imgs2[j2].getAttribute('data-src');
  }
  _lbThumbsBuilt=true;
}
function setLbThumbActive(){
  var grid=document.getElementById('lbthumbs-grid');
  if(!grid) return;
  var prev=grid.querySelector('.lbthumb.active');
  if(prev) prev.classList.remove('active');
  var cur=grid.querySelector('.lbthumb[data-i="'+currentLb+'"]');
  if(cur) cur.classList.add('active');
}
function openLbThumbs(){
  var lb=document.getElementById('lb');
  if(!lb) return;
  buildLbThumbs();
  var tt=document.getElementById('lbthumbs-title');
  if(tt) tt.textContent='Миниатюры · '+PH.length;
  var grid=document.getElementById('lbthumbs-grid');
  if(grid) grid.scrollTop=_lbThumbScrollTop||0;
  lb.classList.add('show-thumbs');
  setLbThumbActive();
  refreshLbThumbsMarks();
  if(grid){
    var cur=grid.querySelector('.lbthumb[data-i="'+currentLb+'"]');
    if(cur) cur.scrollIntoView({block:'center'});
  }
}
function closeLbThumbs(){
  var lb=document.getElementById('lb');
  var grid=document.getElementById('lbthumbs-grid');
  if(grid) _lbThumbScrollTop=grid.scrollTop||0;
  if(lb) lb.classList.remove('show-thumbs');
}
function toggleLbThumbs(){
  var lb=document.getElementById('lb');
  if(!lb||!lb.classList.contains('on')) return;
  if(lb.classList.contains('show-thumbs')) closeLbThumbs();
  else openLbThumbs();
}
function updateLb(){
  var img=document.getElementById('lbi');
  var inp=document.getElementById('lbjnum');
  if(inp){
    inp.max=PH.length;
    inp.value=(currentLb+1);
  }
  var lbl=document.getElementById('lbjlabel');
  if(lbl) lbl.textContent='Фото '+(currentLb+1)+'/'+PH.length;
  setLbThumbActive();
  img.onerror=function(){
    document.getElementById('lbc').textContent='(фото не найдено) '+PH[currentLb].cat;
  };
  img.onload=function(){
    document.getElementById('lbc').textContent=PH[currentLb].cat;
  };
  img.src=PH[currentLb].p;
}

// Клавиатура
document.onkeydown=function(e){
  var lb=document.getElementById('lb');
  var lbOn=lb&&lb.classList.contains('on');
  if(e.key==='Escape') closeLb();
  if(lbOn){
    if(e.key==='ArrowRight') return navigateLb(1);
    if(e.key==='ArrowLeft') return navigateLb(-1);
    return;
  }
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
};

(function(){
  var lb=document.getElementById('lb');
  if(!lb) return;
  lb.addEventListener('mousemove',function(){showZoomArrows();});
  lb.addEventListener('touchstart',function(e){
    if(!lb.classList.contains('on')) return;
    showZoomArrows();
    if(!e.touches||!e.touches[0]) return;
    lb._tx=e.touches[0].clientX;
    lb._ty=e.touches[0].clientY;
  },{passive:true});
  lb.addEventListener('touchend',function(e){
    if(!lb.classList.contains('on')) return;
    var t=e.changedTouches&&e.changedTouches[0];
    if(!t||typeof lb._tx!=='number') return;
    var dx=t.clientX-lb._tx;
    var dy=t.clientY-lb._ty;
    lb._tx=null;lb._ty=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){
      navigateLb(dx<0?1:-1);
    }
  },{passive:true});
})();
