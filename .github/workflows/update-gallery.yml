name: Update Gallery

on:
  push:
    paths:
      - 'images/**'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update gallery
        run: |
          python3 - << 'EOF'
          import re, os

          imgs = sorted(f for f in os.listdir('images') if f.lower().endswith(('.jpg','.jpeg','.png')))
          entries = ["{p:'images/" + img + "',cat:''}" for img in imgs]
          new_ph = 'var PH=[\n' + ',\n'.join(entries) + '\n];'

          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          start = html.index('var PH=[')
          end = html.index('];', start) + 2
          html = html[:start] + new_ph + html[end:]

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)

          print(f"Gallery updated: {len(imgs)} photos")
          EOF

      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add index.html
          git diff --staged --quiet || git commit -m "auto: gallery updated [skip ci]"
          git push
